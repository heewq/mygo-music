# Pushing a tag such as v0.2.0 builds the apps of macOS, Windows and
# Linux, signs them and their updates, and uploads them to a draft
# release of the tag, which is published by hand: installed apps update
# to it then. Running the workflow by hand, from the Actions tab or with
# `gh workflow run release.yml`, does the same for the version in
# mygo.config.ts of the branch it runs on, tagging that commit when the tag
# isn't there yet, and building the tag when it is.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the tag, the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      # mygo.config.ts is code, which Bun runs.
      - uses: oven-sh/setup-bun@v2
      # mygo build uploads to the release of mygo.config.ts's version, so
      # that's the tag. A tag pushed by the workflow's own token starts no
      # other run.
      - name: Find the tag
        id: tag
        run: |
          tag="v$(bun -e 'console.log((await import("./mygo.config.ts")).default({ command: "build" }).version)')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::$GITHUB_REF_NAME doesn't match the version of mygo.config.ts, $tag"
              exit 1
            fi
          elif [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # The notes are the version's section of CHANGELOG.md, or
            # GitHub's own when it has none.
            awk -v v="${TAG#v}" '
              /^## / { if (found) exit; found = index($0, "[" v "]") > 0; next }
              found
            ' CHANGELOG.md > notes.md
            if [ -s notes.md ]; then
              notes=(--notes-file notes.md)
            else
              notes=(--generate-notes)
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$TAG" "${notes[@]}"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # A fork without the Developer ID certificate signs the macOS app ad
      # hoc and doesn't notarize it.
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.draft-release.outputs.tag }}
      # mygo build evaluates mygo.config.ts with Bun.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # setup-go's own cache is keyed on the runner and go.sum alone, so the
      # Windows and Linux jobs, both on Ubuntu, race for one key and only
      # one of them keeps its build cache, and any change to go.sum, like
      # bumping mygo, starts every job cold. This one is per job, and falls
      # back to the job's last cache when go.mod or go.sum changes.
      - name: Find Go's caches
        id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-${{ matrix.name }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ matrix.name }}-
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # The certificate signs the app; the notary profile, "notary" in
      # mygo.config.ts, notarizes its disk image. Both go in a keychain of the
      # job, made the default one, where codesign and notarytool look.
      - name: Import the certificate and the notary credentials
        if: matrix.name == 'macOS' && env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          flags=()
          if [ "${{ matrix.name }}" = macOS ] && [ "$HAS_MACOS_CERTIFICATE" != true ]; then
            flags=(-sign - -skip-notarize)
          fi
          go tool mygo build -platform "${{ matrix.platform }}" "${flags[@]}" -upload
